# @package _global_

defaults:
  - override /model: eam.yaml
  - override /env: cvrp.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: csv.yaml

env:
  generator_params:
    num_loc: 100

logger:
  csv:
    name: "csv/cvrp100_pomo_mechanism/"

model:
  baseline: shared
  num_starts: 64
  num_augment: 8
  batch_size: 64
  val_batch_size: 256
  test_batch_size: 256
  train_data_size: 160_000
  val_data_size: 10_000
  test_data_size: 10_000
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler: "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [80, 95]
    gamma: 0.1
  ea_kwargs:
    num_generations: 64
    mutation_rate: 0.1
    crossover_rate: 0.6
    selection_rate: 0.2
    ea_prob: 1.0
    ea_epoch: -1
    improve_mode: eam
    val_improve_mode: eam
    val_improve: true
    val_improve_prob: 1.0
    val_num_generations: 64
  mechanism:
    enabled: true
    variant: eam
    log_every: 10
    save_root: outputs/mechanism
    base_traj: 64
    extra_traj: 64
    refine_budget: 64
    trigger_every: 1
    diversity_metric: edge_jaccard
    objective_sense: min
    paired_gain: true
    compute_delta_nll: true
    seed: ${seed}
    backbone: pomo

trainer:
  max_epochs: 100
  precision: "32-true"

seed: 1234
