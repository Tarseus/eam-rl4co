# @package _global_

defaults:
  - override /model: eam.yaml
  - override /env: op.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: csv.yaml

env:
  generator_params:
    num_loc: 100

logger:
  csv:
    name: "csv/op100_am_mechanism/"

model:
  baseline: rollout
  num_starts: 1
  num_augment: 8
  batch_size: 256
  val_batch_size: 512
  test_batch_size: 512
  train_data_size: 1_280_000
  val_data_size: 10_000
  test_data_size: 10_000
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler: "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [80, 95]
    gamma: 0.1
  ea_kwargs:
    num_generations: 1
    mutation_rate: 0.1
    crossover_rate: 0.6
    selection_rate: 0.2
    ea_prob: 1.0
    ea_epoch: -1
    improve_mode: eam
    val_improve_mode: eam
    val_improve: true
    val_improve_prob: 1.0
    val_num_generations: 1
  mechanism:
    enabled: true
    variant: eam
    log_every: 1
    save_root: outputs/mechanism
    base_traj: 1
    extra_traj: 1
    refine_budget: 1
    trigger_every: 1
    trigger_mode: periodic
    diversity_metric: node_jaccard
    objective_sense: max
    paired_gain: true
    compute_delta_nll: true
    seed: ${seed}
    backbone: am

trainer:
  max_epochs: 100
  precision: "32-true"
  num_sanity_val_steps: 0
  log_every_n_steps: 1

seed: 1234
