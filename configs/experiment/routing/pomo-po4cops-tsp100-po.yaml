# @package _global_

defaults:
  - override /model: pomo.yaml
  - override /env: tsp.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: csv.yaml

env:
  generator_params:
    num_loc: 100

model:
  loss_type: po_loss
  alpha: 0.05
  num_starts: 100
  batch_size: 64
  train_data_size: 100000
  val_data_size: 10000
  test_data_size: 10000
  optimizer: Adam
  optimizer_kwargs:
    lr: 3e-4
    weight_decay: 1e-6
  lr_scheduler: MultiStepLR
  lr_scheduler_kwargs:
    milestones: [3001]
    gamma: 0.2
  policy_kwargs:
    po4cops_compat: true
    embed_dim: 128
    num_encoder_layers: 6
    decoder_layer_num: 1
    qkv_dim: 16
    num_heads: 8
    feedforward_hidden: 512
    tanh_clipping: 50
    eval_type: argmax
    val_decode_type: greedy
    test_decode_type: greedy

trainer:
  max_epochs: 2010
  accelerator: gpu
  devices: [1]
  strategy: auto
  precision: 32-true
  gradient_clip_val: null
  accumulate_grad_batches: 1
  enable_progress_bar: false
  log_every_n_steps: 50

seed: 1234
