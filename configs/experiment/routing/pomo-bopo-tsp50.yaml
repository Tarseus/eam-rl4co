# @package _global_
# BOPO TSP50 stability-first setting.
# We keep the BOPO routing setup aligned with the working TSP100 baseline, but
# use the standard 50-node rollout count and batch size used elsewhere here.

defaults:
  - override /model: pomo.yaml
  - override /env: tsp.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: csv.yaml

hydra:
  run:
    dir: ${paths.log_dir}/${mode}/runs/pomo-bopo-tsp50_${now:%Y%m%d-%H%M%S}

env:
  generator_params:
    num_loc: 50

model:
  loss_type: bopo_loss
  alpha: 0.05
  bopo_pair_mode: anchor_best
  bopo_select_strategy: paper
  bopo_select_k: 16
  bopo_select_quantile: 0.5
  num_starts: 50
  batch_size: 64
  train_data_size: 100000
  val_data_size: 10000
  test_data_size: 10000
  optimizer: Adam
  optimizer_kwargs:
    lr: 3e-4
    weight_decay: 1e-6
  lr_scheduler: MultiStepLR
  lr_scheduler_kwargs:
    milestones: [3001]
    gamma: 0.2
  policy_kwargs:
    po4cops_compat: true
    # `same` is closer to the official BOPO TSP setup, but `pomo` starts have
    # been more stable with this decoder implementation.
    start_node: pomo
    embed_dim: 128
    num_encoder_layers: 6
    decoder_layer_num: 1
    qkv_dim: 16
    num_heads: 8
    feedforward_hidden: 512
    tanh_clipping: 50
    eval_type: hybrid
    val_decode_type: greedy
    test_decode_type: greedy
  metrics:
    train: ["loss", "reward", "max_reward", "bopo_loss", "bopo_pair_count"]
    val: ["reward", "max_reward"]
    test: ${model.metrics.val}

trainer:
  max_epochs: 2100
  accelerator: gpu
  devices: [0]
  strategy: auto
  precision: 32-true
  gradient_clip_val: null
  accumulate_grad_batches: 1
  enable_progress_bar: false
  log_every_n_steps: 50

seed: 1234
