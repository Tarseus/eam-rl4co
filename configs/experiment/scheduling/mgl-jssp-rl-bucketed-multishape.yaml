# @package _global_
# Phase 4: Bucket-by-shape training supporting 10x10, 15x15, 20x20

defaults:
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: csv.yaml
  - override /env: jssp/10j-10m.yaml  # Just for schema, actual data can be mixed

trainer:
  max_epochs: 2
  precision: 32-true
  gradient_clip_val: null

callbacks:
  model_checkpoint:
    monitor: "val/gap"
    mode: "min"
    save_top_k: 1
    save_last: True

seed: 69
test: False

tags: ["mgl-jssp-rl-bucketed", "jssp", "phase4", "multishape"]

model:
  _target_: rl4co.models.zoo.mgl_jssp.model.MGLJSSPModel
  baseline: rl
  train_data_dir: ${paths.root_dir}/data/jssp_bopo/train
  val_data_dir: ${paths.root_dir}/data/jssp_bopo/validation
  test_data_dir: null
  use_cached: true
  batch_size: 4
  val_batch_size: 1
  test_batch_size: 1
  dataloader_num_workers: 0
  optimizer: Adam
  optimizer_kwargs:
    lr: 2e-4
  enc_hidden: 64
  enc_out: 128
  mem_hidden: 64
  mem_out: 128
  clf_hidden: 128
  B: 128
  K: 16
  D: 1
  val_B: 128
  test_B: 128
  greedy: 0
  log_on_step: true  # Enable to see shape logs
  # Phase 4: Bucket-by-shape options
  use_shape_buckets: true
  bucket_drop_last: false
  allowed_shapes: [[10, 10], [15, 15], [20, 20]]
  metrics:
    train: ["loss", "reward", "quality"]
    val: ["reward", "gap", "makespan"]
    test: ${model.metrics.val}
