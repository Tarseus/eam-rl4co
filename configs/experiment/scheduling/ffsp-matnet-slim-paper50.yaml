# @package _global_
# SLIM objective extension on the matched MatNet FFSP50 backbone.
defaults:
  - override /model: matnet.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: csv.yaml
  - override /env: ffsp.yaml

hydra:
  run:
    dir: ${paths.log_dir}/${mode}/runs/ffsp-matnet-slim-paper50_${now:%Y%m%d-%H%M%S}

env:
  generator_params: {num_stage: 3, num_machine: 4, num_job: 50, flatten_stages: false}

trainer:
  max_epochs: 200
  precision: 16-mixed
  gradient_clip_val: null
  accumulate_grad_batches: 1
  enable_progress_bar: true

seed: 12345678
test: false

model:
  _target_: rl4co.models.MatNet
  loss_type: slim_loss
  num_starts: 24
  batch_size: 64
  train_data_size: 1000
  val_data_size: 1000
  test_data_size: 1000
  optimizer_kwargs: {lr: 1e-4, weight_decay: 1e-6}
  lr_scheduler: MultiStepLR
  lr_scheduler_kwargs: {milestones: [101, 151], gamma: 0.1}
  metrics:
    train: [loss, reward, max_reward, slim_loss]
    val: [reward, max_reward]
    test: ${model.metrics.val}
    log_on_step: false
  policy_params:
    embed_dim: 256
    num_encoder_layers: 3
    num_heads: 16
    normalization: instance
    use_graph_context: false
    feedforward_hidden: 512
    train_decode_type: sampling
    val_decode_type: greedy
    test_decode_type: greedy
