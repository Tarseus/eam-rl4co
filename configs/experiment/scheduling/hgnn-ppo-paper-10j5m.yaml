# @package _global_

defaults:
  - scheduling/base
  - override /env: fjsp/10j-5m.yaml

logger:
  wandb:
    tags: ["hgnn-ppo-paper", "${env.name}"]
    name: "hgnn-ppo-paper-${env.generator_params.num_jobs}j-${env.generator_params.num_machines}m"

trainer:
  max_epochs: 10
  precision: 32-true

model:
  _target_: rl4co.models.L2DPPOModel
  batch_size: 20
  val_batch_size: 100
  test_batch_size: 100
  mini_batch_size: 512
  optimizer_kwargs:
    lr: 2e-4
    weight_decay: 0.0
  policy_kwargs:
    embed_dim: 256
    num_encoder_layers: 3
    scaling_factor: ${scaling_factor}
    het_emb: True
    normalization: instance
  ppo_epochs: 3
  clip_range: 0.2
  vf_lambda: 0.5
  entropy_lambda: 0.01
  update_timestep: 1
  max_grad_norm: 1

env:
  stepwise_reward: True
