# @package _global_

defaults:
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: wandb.yaml
  - override /env: fjsp/10j-5m.yaml

logger:
  wandb:
    project: "rl4co"
    log_model: "all"
    group: "bopo-fjsp-${env.generator_params.num_jobs}j-${env.generator_params.num_machines}m"
    tags: ["bopo-fjsp-paper", "${env.name}"]
    name: "bopo-fjsp-paper-${env.generator_params.num_jobs}j-${env.generator_params.num_machines}m"

trainer:
  max_epochs: 20
  precision: 32-true
  gradient_clip_val: null

seed: 69

model:
  _target_: rl4co.models.zoo.bopo_fjsp.model.BOPOFJSPModel
  train_data_dir: ${paths.root_dir}/BOPO/FJSP/dataset
  val_data_dir: ${paths.root_dir}/BOPO/FJSP/benchmarks/validation
  test_data_dir: ${paths.root_dir}/BOPO/FJSP/benchmarks/LA-e
  use_cached: true
  batch_size: 1
  val_batch_size: 1
  test_batch_size: 1
  optimizer: Adam
  optimizer_kwargs:
    lr: 2e-5
  enc_hidden: 64
  enc_out: 128
  mem_hidden: 64
  mem_out: 128
  clf_hidden: 128
  B: 256
  K: 16
  val_B: 256
  test_B: 32
  greedy: 1
  metrics:
    train: ["loss", "reward"]
    val: ["reward", "gap", "makespan"]
    test: ${model.metrics.val}
