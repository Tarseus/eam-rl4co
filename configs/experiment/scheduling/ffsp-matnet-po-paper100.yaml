# @package _global_

defaults:
  - override /model: matnet.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: csv.yaml
  - override /env: ffsp.yaml

env:
  generator_params:
    num_stage: 3
    num_machine: 4
    num_job: 100
    flatten_stages: false

trainer:
  max_epochs: 200
  precision: 16-mixed
  gradient_clip_val: null

seed: 12345678

model:
  _target_: rl4co.models.MatNet
  loss_type: po_loss
  # PO4COPs Table 9: FFSP100 uses the Exponential preference function with alpha=1.0.
  po_impl: exponential
  alpha: 1.0
  num_starts: 24
  batch_size: 50
  train_data_size: 1_000
  val_data_size: 1_000
  test_data_size: 1_000
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler: "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [101, 151]
    gamma: 0.1
  metrics:
    train: ["loss", "reward", "max_reward", "po_loss", "po_pref_rate"]
    val: ["reward", "max_reward"]
    test: ${model.metrics.val}
    log_on_step: false
  policy_params:
    embed_dim: 256
    num_encoder_layers: 3
    num_heads: 16
    normalization: instance
    use_graph_context: false
    feedforward_hidden: 512
    train_decode_type: sampling
    val_decode_type: greedy
    test_decode_type: greedy
