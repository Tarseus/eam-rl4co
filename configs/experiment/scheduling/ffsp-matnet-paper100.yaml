# @package _global_

defaults:
  - override /model: matnet.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: wandb.yaml
  - override /env: ffsp.yaml

logger:
  wandb:
    project: "rl4co"
    log_model: "all"
    group: "${env.name}-${env.generator_params.num_job}-${env.generator_params.num_machine}"
    tags: ["matnet-paper", "${env.name}"]
    name: "matnet-paper-${env.name}-${env.generator_params.num_job}j-${env.generator_params.num_machine}m"

env:
  generator_params:
    num_stage: 3
    num_machine: 4
    num_job: 100
    flatten_stages: False

trainer:
  max_epochs: 200
  precision: 16-mixed
  gradient_clip_val: null
  log_every_n_steps: 10

seed: 12345678

model:
  _target_: rl4co.models.MatNet
  num_starts: 24
  batch_size: 32
  train_data_size: 1_000
  val_data_size: 1_000
  test_data_size: 1_000
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler: "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [101, 151]
    gamma: 0.1
  policy_params:
    embed_dim: 256
    num_encoder_layers: 3
    num_heads: 16
    normalization: instance
    use_graph_context: False
    feedforward_hidden: 512
    train_decode_type: sampling
    val_decode_type: greedy
    test_decode_type: greedy
