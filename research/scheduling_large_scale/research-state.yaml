project:
  title: "Large-scale FFSP/JSSP common-checkpoint preference continuation"
  question: "Can original USW and ASW, from an identical strong checkpoint and fresh optimizer, outperform matched PO and BOPO at FFSP1000 and JSSP50x20 without materially degrading solution quality?"
  status: active
  started: "2026-07-17"
  domain: "neural combinatorial optimization / scheduling"

literature:
  key_papers:
    - id: kwon2021matnet
      title: "Matrix Encoding Networks for Neural Combinatorial Optimization"
      relevance: "Trains FFSP20/50/100 and reports zero-shot FFSP1000 evaluation."
    - id: liao2025bopo
      title: "BOPO: Neural Combinatorial Optimization via Best-anchored and Objective-guided Preference Optimization"
      relevance: "Uses MGL, B=256, K=16, 20 epochs, and evaluates JSSP through 100x20."
  open_problems:
    - "Published large-scale scheduling evidence does not compare discovered USW/ASW objectives from an identical checkpoint against both PO and BOPO."
  evidence_gaps:
    - "FFSP1000 has only reached the 100-update screen; its 500-update stability remains unmeasured."
    - "PO has no published JSSP50x20 target, and USW/ASW are unpublished objectives; BOPO is the only direct paper control."

hypotheses:
  - id: H0
    statement: "The existing FFSP100 and JSSP15x15 architectures can execute target-scale forward/backward passes with instance-local candidate pools on available 24 GiB GPUs."
    status: supported
    motivation: "Feasibility and semantic correctness must be established before optimization comparisons."
    parent: null
    priority: high
  - id: H1
    statement: "At a small fresh-Adam learning rate, original USW and ASW will improve faster than PO and BOPO from the same target-selected common checkpoint."
    status: active
    motivation: "TSP1000/CVRP1000 showed that checkpoint-backed low-LR continuation can recover preference-objective gains."
    parent: null
    priority: high
  - id: H2
    statement: "Stage-gated continuation up to the source-scale optimizer-update envelope is sufficient; a full from-scratch instance budget is unnecessary."
    status: pending
    motivation: "FFSP1000 and JSSP50x20 rollouts are much more expensive than source-scale rollouts."
    parent: H1
    priority: medium
  - id: H3
    statement: "Separately labelled low-LR USW and low-LR/alpha-calibrated ASW variants can recover stable JSSP50x20 validation improvement from the same locked checkpoint."
    status: mixed
    motivation: "TSP1000/CVRP1000 benefited from checkpoint-backed low-LR continuation; JSSP USW showed transient improvement before regression, while ASW's regret exponent is plausibly scale-saturated."
    parent: H1
    priority: high
  - id: H4
    statement: "Validation-selected USW or ASW calibration can beat BOPO when all methods use the identical H3 validation32 stream, common checkpoint, training order, rollout semantics, and update gates."
    status: active
    motivation: "H3 found lower validation means than the old H1 BOPO result, but the means came from different validation-set sizes; a matched BOPO curve is required before claiming victory."
    parent: H3
    priority: high
  - id: H5
    statement: "Preserving the discovered USW/ASW loss and ASW weight formula while replacing dense pair construction with BOPO-matched rank-stratified 15-edge instance-local anchors can beat matched BOPO on validation32."
    status: not_supported
    motivation: "All dense LR/WD/alpha calibrations failed, while dense variants use about 8100 pairs per update versus BOPO's 15; H5 isolates pair geometry and gradient density."
    parent: H4
    priority: high
  - id: H6
    statement: "Matching the sparse USW LR-times-gradient update scale to matched BOPO by raising LR from 5e-7 to 1e-6 can close the remaining validation32 gap while preserving the H5 loss and 15-edge instance-local geometry."
    status: not_supported
    motivation: "H5 USW improved at every gate from step150 through step300 but remained 3.093720 above BOPO; its observed mean LR-times-gradient scale was about half BOPO's."
    parent: H5
    priority: high
  - id: H7
    statement: "Source-length-calibrating USW log-probability differences from 1000 JSSP50x20 decisions back to the 100-decision JSSP10x10 discovery scale can match BOPO's gradient and update scales while preserving the sparse 15-edge local geometry."
    status: not_supported
    motivation: "H6 matched LR-times-gradient scale without changing the loss curvature and still missed BOPO by 2.937516; H5/H6 gradients were about 9.3x BOPO, matching the 10x source-to-target trajectory-length ratio."
    parent: H6
    priority: high
  - id: H8
    statement: "A mean-one pair-relative advantage-gap temperature inside H7's source-normalized sigmoid link can emphasize wider-quality local comparisons and beat matched BOPO without changing mean scale or pair geometry."
    status: mixed
    motivation: "H7 matches BOPO's gradient and initial logit scales but still misses by 3.062500; its 15 first-instance relative gaps span 0.0139 to 0.0637 while one global normalizer treats them equally."
    parent: H7
    priority: high
  - id: H9
    statement: "If H8 fails to improve after step250, H7's source-normalized loss combined with H5 ASW gap-regret weights can improve cross-instance consistency without changing sparse local geometry."
    status: not_run
    motivation: "Conditionally preregistered before H8 step450, but its launch condition became false when H8 improved at steps450 and500; it remains preserved and unexecuted."
    parent: H8
    priority: low
  - id: H10
    statement: "H7 source normalization combined with H5 ASW's bounded gap-regret weights can convert H8's mean-only win into a more instance-consistent advantage over matched BOPO."
    status: not_supported
    motivation: "H8 step500 beats BOPO by 4.687523 on mean but loses on 17/32 instances and fails the locked bootstrap/Wilcoxon/Holm inference gate."
    parent: H8
    priority: high
  - id: H11
    statement: "A mean-one square-root relative-gap temperature can retain H8's source-normalized matched-mean advantage while reducing extreme-pair pressure and cross-instance heterogeneity."
    status: not_supported
    motivation: "H8's linear temperature beats BOPO on mean but fails paired inference; H10 shows that removing gap temperature and substituting ASW weights loses the mean advantage."
    parent: H8
    priority: high
  - id: H12
    statement: "Clipping each physical-batch-one H8 update to gradient norm 1.0 can preserve its matched-mean advantage while limiting atypical instance-driven policy shifts."
    status: active
    motivation: "H8 beats BOPO on mean but is heterogeneous across instances; H8/H11 pre-clip gradients contain rare excursions up to 3.209301/6.609443 despite medians near 0.46."
    parent: H8
    priority: high
  - id: H13
    statement: "A 50-update low-LR ASW micro-adaptation from H8 step500 can retain or improve H8's matched-mean advantage without replaying its first 500 training instances."
    status: mixed
    motivation: "The locked step30 hybrid improved H8 by 1.875069 and matched BOPO by 6.562592 on validation mean, but it inherits 500 USW updates and has not passed paired inference, so it supports a sequential ASW contribution rather than an original-ASW claim."
    parent: H8
    priority: high
  - id: H14
    statement: "The validation-locked H8 USW and H13 H8-to-ASW hybrid improve paired official TA+DMU JSSP50x20 gaps over matched BOPO with familywise statistical significance."
    status: not_supported
    motivation: "Both candidates improved the pooled official-test mean, but n=20 was heterogeneous: H8/H13 bootstrap intervals crossed zero and Holm p-values were 0.348810/0.285812."
    parent: H13
    priority: high
  - id: H15
    statement: "Frozen H8 and H13 improve over BOPO with conservative familywise significance on an independent 256-instance generated JSSP50x20 test."
    status: not_supported
    motivation: "The generated256 replication found near-balanced per-instance wins and wide intervals: H8 mean was slightly worse than BOPO, while H13's -2.394558 mean advantage still had CI crossing zero and Holm p=0.253797."
    parent: H14
    priority: high

experiments:
  proxy_metric: "Held-out fixed validation mean cost; primary score is max(USW-min(PO,BOPO), ASW-min(PO,BOPO)); lower is better."
  baseline_value: null
  best_value: null
  total_runs: 82
  trajectory:
    - cycle: 0
      experiment: "local reduced-scale objective-path smoke"
      result: "8/8 finite nonzero-gradient updates; identical initialization within each problem"
      decision: "proceed to target-scale GPU feasibility probes"
    - cycle: 1
      experiment: "fresh target-validation source-checkpoint selection (8 instances, no final test data)"
      result: "FFSP1000 selected loss_only/USW at 804.625 mean; JSSP50x20 selected weighting/ASW at 3103.875 mean"
      decision: "lock one common checkpoint per problem and clone it across PO/BOPO/USW/ASW"
    - cycle: 2
      experiment: "JSSP50x20 FP32 one-update H0 probes"
      result: "4/4 finite nonzero-gradient updates; 4.40-4.47 sec/update; 11.56-11.58 GiB peak allocated"
      decision: "JSSP50x20 passes H0 at B=128/K=16; FFSP1000 requires the protocol-approved BF16 memory adaptation"
    - cycle: 3
      experiment: "FFSP1000 BF16 one-update H0 probes plus locked backend-stability confirmatory rerun"
      result: "4/4 objectives produced finite nonzero-gradient updates with 24 candidates at about 18.04 GiB; disabling cuDNN SDPA gave BOPO 17.94 GiB and a clean exit"
      decision: "H0 supported; use BF16 with cuDNN SDPA disabled for FFSP1000, and FP32 for JSSP50x20"
    - cycle: 4
      experiment: "exact FFSP forced-replay equivalence and FFSP1000 PO probe"
      result: "zero replay error, exact small-scale full-graph gradient match, and finite FFSP1000 PO update at 0.215 GiB/89.4 sec"
      decision: "retain exact FP32 replay as audit/fallback; use the faster locked BF16 backend for the clean 100-update comparison"
    - cycle: 5
      experiment: "clean 100-update FFSP1000 and JSSP50x20 objective screens"
      result: "FFSP: USW=ASW=800.625 beat PO=801.125 and BOPO=803.625; JSSP: BOPO=3128.250 was best while USW=3140.500 and ASW=3132.125 failed the ranking criterion"
      decision: "continue JSSP to the pre-registered 500-update gate to distinguish delayed improvement from objective instability"
    - cycle: 6
      experiment: "matched JSSP50x20 continuation to step 500 plus official TA50x20 paper-alignment evaluation"
      result: "BOPO remained stable and reached validation 3121.875; USW was transiently best at step 300 (3124.875) then regressed, ASW never improved on step 0. The PO artifact contains two duplicate continuations and is excluded from promotion, though both deteriorated. On TA50x20, selected BOPO gaps were 9.372% at B'=128 and 8.895% at B'=512, within +2 pp of the paper's 8.0% and 7.4%."
      decision: "stop extending the current JSSP USW/ASW objectives; the H1 JSSP branch is negative, while BOPO passes the paper-alignment guard"
    - cycle: 7
      experiment: "H3 JSSP50x20 calibrated-variant smoke launch audit"
      result: "All six variants produced finite nonzero gradients with B=128, physical batch 1, and 8117 instance-local pairs, but each output history contains two appended executions because a timed-out submission was retried. All twelve executions are provenance-invalid and excluded."
      decision: "do not promote or screen from these artifacts; preserve every output and retry only once in fresh collision-free directories after a no-active-process preflight"
    - cycle: 8
      experiment: "clean sequential H3 JSSP50x20 calibrated-variant smoke retry"
      result: "6/6 histories contain exactly one step-0 validation, one finite nonzero-gradient update, and one step-1 validation. Every run used B=128, physical batch 1, and 8117 instance-local pairs. Step-1 means were USW 3092.563/3092.969 and ASW alpha 1/0/0.25/0.5 = 3091.469/3091.250/3091.469/3091.469 versus common step0 3093.375."
      decision: "the H3 smoke gate passes; run the locked 100-update screen with validation-only selection at steps 0/50/100, without interpreting step-1 rankings as promotion evidence"
    - cycle: 9
      experiment: "locked H3 JSSP50x20 six-variant 100-update screen"
      result: "All six runs completed exactly 100 finite-loss, finite nonzero-gradient updates with B=128, physical batch one, and instance-local diagnostics; the six exact logs had no runtime/OOM/non-finite/traceback/segfault/kill match. Step-50/100 validation32 means from common step0 3093.375 were USW LR 5e-6 3092.000/3096.906, USW LR 2e-6 3094.375/3091.594, ASW alpha 1 3089.000/3096.531, alpha 0 3088.625/3092.406, alpha 0.25 3093.969/3091.344, and alpha 0.5 3092.406/3096.875."
      decision: "promote only USW LR=2e-6 step100 and ASW LR=5e-6 alpha=0 step50; preserve all labels and continue each in a new checkpoint chain to absolute step 500 without final-test access"
    - cycle: 10
      experiment: "H3 validation-selected USW/ASW continuation to absolute step 500"
      result: "Both continuations exited cleanly at absolute step500. USW completed 400 unique steps (101-500) with validation32 means 3096.656/3090.437/3091.344/3096.656 at steps200/300/400/500; ASW completed 450 unique steps (51-500) with means 3092.406/3087.688/3098.156/3089.281/3100.125 at steps100/200/300/400/500. Every continuation loss and gradient was finite, every gradient was nonzero, B=128/K=16 and physical batch one were preserved, pair scope remained within instance, and the exact logs had no matched runtime/OOM/non-finite/traceback/segfault/kill error."
      decision: "lock USW LR=2e-6 step300 (3090.437) and ASW LR=5e-6 alpha=0 step200 (3087.688) using validation only. Both beat common step0 3093.375, but both regress at step500, so H3 recovers better checkpoints without establishing terminal stability. Do not run TA/DMU/final evaluation in this monitor cycle."
    - cycle: 11
      experiment: "H4 matched validation32 BOPO reference"
      result: "Protocol commit 5172e656e locked the fair-comparison gate. BOPO LR1e-5 launched once on idle GPU7 as PID464339. Its step0 validation32 mean exactly reproduced H3 at 3093.375015; steps1-3 had finite losses, finite nonzero gradients, B128/K16, physical batch one, 15 instance-local anchored pairs, and about 11.57 GiB peak allocation."
      decision: "continue the untouched BOPO run to step500 and compare its minimum validation32 mean against the pre-existing H3 USW step300 and ASW step200 locks. Launch conditional Phase B only if neither candidate wins."
    - cycle: 12
      experiment: "H4 matched BOPO completion and conditional Phase-B search"
      result: "Matched BOPO completed 500/500 finite-loss, finite nonzero-gradient updates with B128/K16, physical batch one, 15 instance-local anchored pairs, about 11.57 GiB peak allocation, and a clean error scan. Its validation32 minimum was step500 at 3085.312515. Conditional ASW LR2e-6 alpha0, USW LR1e-6/WD1e-6, USW LR5e-7/WD1e-6, USW LR1e-6/WD0, and ASW LR1e-6/alpha0 each completed 300/300 unique finite-loss, finite positive-gradient updates with B128/K16, physical batch one, instance-local pairs, and clean exact-log error scans. Their best validation32 means were 3092.499985, 3091.093864, 3090.406212, 3092.999977, and 3086.500031, respectively, all above matched BOPO. Queue PID475104 handed off exactly once to the final preregistered ASW LR1e-6/alpha0.25 PID497053; its step0/50 means are 3093.375015/3091.750084 and an audit through step58 passed all numerical and semantic checks."
      decision: "The first five completed Phase-B configurations are negative and are not promoted or retried. Continue only the final preregistered ASW LR1e-6/alpha0.25 screen unchanged; require it to beat 3085.312515 on the matched validation32 stream before paired inference. If it fails, preregister the bounded anchored-pair geometry hypothesis before any new launch."
    - cycle: 13
      experiment: "H4 final dense Phase-B ASW LR1e-6/alpha0.25 completion"
      result: "The final configuration completed exactly 300 train events and seven validation32 gates with B128/K16, physical batch one, positive instance-local pair counts, and a zero-match exact-log error scan. Validation means at steps0/50/100/150/200/250/300 were 3093.375015/3091.750084/3096.093674/3091.874977/3090.312454/3092.062462/3093.218842. Its best step200 remained 5.000061 above matched BOPO 3085.312515."
      decision: "Phase B is exhausted: all six dense configurations are negative and must not be promoted or retried. Preregister the bounded H5 rank-stratified 15-edge anchor-geometry variants before any new launch; keep the common checkpoint, validation32 stream, B128/K16, physical batch one, and family-leading calibration fixed."
    - cycle: 14
