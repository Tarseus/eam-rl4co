project:
  title: "Large-scale FFSP/JSSP common-checkpoint preference continuation"
  question: "Can original USW and ASW, from an identical strong checkpoint and fresh optimizer, outperform matched PO and BOPO at FFSP1000 and JSSP50x20 without materially degrading solution quality?"
  status: active
  started: "2026-07-17"
  domain: "neural combinatorial optimization / scheduling"

literature:
  key_papers:
    - id: kwon2021matnet
      title: "Matrix Encoding Networks for Neural Combinatorial Optimization"
      relevance: "Trains FFSP20/50/100 and reports zero-shot FFSP1000 evaluation."
    - id: liao2025bopo
      title: "BOPO: Neural Combinatorial Optimization via Best-anchored and Objective-guided Preference Optimization"
      relevance: "Uses MGL, B=256, K=16, 20 epochs, and evaluates JSSP through 100x20."
  open_problems:
    - "Published large-scale scheduling evidence does not compare discovered USW/ASW objectives from an identical checkpoint against both PO and BOPO."
  evidence_gaps:
    - "FFSP1000 full-rollout/backward memory and throughput are not yet measured."
    - "JSSP50x20 B=128 backward memory and throughput are not yet measured."

hypotheses:
  - id: H0
    statement: "The existing FFSP100 and JSSP15x15 architectures can execute target-scale forward/backward passes with instance-local candidate pools on available 24 GiB GPUs."
    status: supported
    motivation: "Feasibility and semantic correctness must be established before optimization comparisons."
    parent: null
    priority: high
  - id: H1
    statement: "At a small fresh-Adam learning rate, original USW and ASW will improve faster than PO and BOPO from the same target-selected common checkpoint."
    status: active
    motivation: "TSP1000/CVRP1000 showed that checkpoint-backed low-LR continuation can recover preference-objective gains."
    parent: null
    priority: high
  - id: H2
    statement: "Stage-gated continuation up to the source-scale optimizer-update envelope is sufficient; a full from-scratch instance budget is unnecessary."
    status: pending
    motivation: "FFSP1000 and JSSP50x20 rollouts are much more expensive than source-scale rollouts."
    parent: H1
    priority: medium

experiments:
  proxy_metric: "Held-out fixed validation mean cost; primary score is max(USW-min(PO,BOPO), ASW-min(PO,BOPO)); lower is better."
  baseline_value: null
  best_value: null
  total_runs: 37
  trajectory:
    - cycle: 0
      experiment: "local reduced-scale objective-path smoke"
      result: "8/8 finite nonzero-gradient updates; identical initialization within each problem"
      decision: "proceed to target-scale GPU feasibility probes"
    - cycle: 1
      experiment: "fresh target-validation source-checkpoint selection (8 instances, no final test data)"
      result: "FFSP1000 selected loss_only/USW at 804.625 mean; JSSP50x20 selected weighting/ASW at 3103.875 mean"
      decision: "lock one common checkpoint per problem and clone it across PO/BOPO/USW/ASW"
    - cycle: 2
      experiment: "JSSP50x20 FP32 one-update H0 probes"
      result: "4/4 finite nonzero-gradient updates; 4.40-4.47 sec/update; 11.56-11.58 GiB peak allocated"
      decision: "JSSP50x20 passes H0 at B=128/K=16; FFSP1000 requires the protocol-approved BF16 memory adaptation"
    - cycle: 3
      experiment: "FFSP1000 BF16 one-update H0 probes plus locked backend-stability confirmatory rerun"
      result: "4/4 objectives produced finite nonzero-gradient updates with 24 candidates at about 18.04 GiB; disabling cuDNN SDPA gave BOPO 17.94 GiB and a clean exit"
      decision: "H0 supported; use BF16 with cuDNN SDPA disabled for FFSP1000, and FP32 for JSSP50x20"
    - cycle: 4
      experiment: "exact FFSP forced-replay equivalence and FFSP1000 PO probe"
      result: "zero replay error, exact small-scale full-graph gradient match, and finite FFSP1000 PO update at 0.215 GiB/89.4 sec"
      decision: "retain exact FP32 replay as audit/fallback; use the faster locked BF16 backend for the clean 100-update comparison"
  final_success:
    ranking: "USW and ASW must each have lower paired mean cost than both PO and BOPO."
    inference: "Candidate-minus-baseline paired bootstrap 95% CIs must be wholly below zero; paired Wilcoxon tests use one locked Holm family per problem."
    ffsp1000_noninferiority: "Each promoted method must be within 1% of the common checkpoint zero-shot mean unless it improves it."
    jssp50x20_noninferiority: "Each promoted method must be within 2% of the common checkpoint zero-shot mean unless it improves it."

protocol:
  common_initialization:
    selection: "Select exactly one source checkpoint per problem using only a fresh locked target-scale validation set, then copy identical policy weights to all four methods."
    optimizer: "Fresh Adam for every method; identical LR, weight decay, data order, effective instance batch, and update budget."
    locked_checkpoints:
      ffsp1000: "downloads/ffsp100/loss_only.ckpt (SHA d92e8319b91406c0a80d1844b6fc42c419b8bd71d66a35e0f56d9d1a6d9dca83; validation mean 804.625)"
      jssp50x20: "downloads/jssp15x15/weighting/checkpoint.ckpt (SHA 5a90dc4027c08ef7bb2192a84a752a638bd4c59c46a24bf2a57c3721baaf8584; validation mean 3103.875061)"
  candidate_pools:
    ffsp: "One physical instance per microbatch, 24 machine-order starts; gradient accumulation may increase effective instance batch."
    jssp: "One physical instance per microbatch initially, B=128 and K=16; all PO/BOPO/USW/ASW pairs remain within the instance."
  precision_backend:
    ffsp1000: "BF16 autocast with torch.backends.cuda.enable_cudnn_sdp(False); all 24 starts retained"
    ffsp1000_audit_fallback: "Exact FP32 no-grad rollout plus forced-action/RNG checkpoint replay; zero replay error and 0.215 GiB target-scale peak"
    jssp50x20: "FP32 at B=128/K=16"
  stage_gates:
    probe: "One optimizer update with finite loss/gradient, no OOM, correct instance-local diagnostics."
    screen: [100, 500]
    promotion: [2000, 5000]
    maximum_updates:
      ffsp1000: 6250
      jssp50x20: 25000
  test_discipline: "Do not read the final fixed paired test set until one validation-selected checkpoint per method is locked."

outer_loop:
  cycle: 4
  last_direction: deepen
  last_reflection: "H0 is supported by both the locked BF16 backend and an exact FP32 replay fallback. Clean FFSP and JSSP 100-update screens are active; promote only from their fixed validation results."

workspace:
  findings: "research/scheduling_large_scale/findings.md"
  log: "research/scheduling_large_scale/research-log.md"
  literature_dir: "research/scheduling_large_scale/literature/"
  experiments_dir: "research/scheduling_large_scale/experiments/"
  to_human_dir: "research/scheduling_large_scale/to_human/"
  paper_dir: "research/scheduling_large_scale/paper/"

