project:
  title: "Make USW/ASW beat PO on TSP1000"
  question: "Which sampling, temperature, weighting, and schedule configuration makes USW or ASW significantly outperform PO on the canonical TSP1000 fixed test?"
  status: active
  started: "2026-07-14"
  domain: "reinforcement learning for neural combinatorial optimization"

evaluation:
  fast_proxy: "fixed validation set of 32 TSP1000 instances, 1000 starts, augmentation=1"
  final_metric: "canonical fixed100 mean tour length, 1000 starts, 8 augment, FP32"
  canonical_dataset: "data/tsp/tsp1000_test_seed1234.npz"
  canonical_sha256: "fc544f59443a9352f4f3317603d39fae8123cba8502864cae8355e595555f865"
  po_baseline_mean_tour_length: 27.13804609298706
  po_baseline_training_budget: "1000 continuation steps from the PO pilot best checkpoint at optimizer step 75; K=20, batch=128"
  success_criterion: "Only after an USW or ASW candidate also receives 1000 continuation steps from its method-specific pilot best checkpoint: mean tour length < 27.13804609298706 and paired bootstrap 95% CI for candidate-minus-PO lies below zero"

hypotheses:
  - id: H1
    statement: "Increasing per-instance candidate paths from K=20 to K=40/64 improves preference estimation enough to overcome lower unique-instance throughput."
    status: supported
    priority: high
  - id: H2
    statement: "Reducing alpha from 0.05 to 0.01 prevents late logistic saturation on TSP1000."
    status: supported
    priority: high
  - id: H3
    statement: "Detaching ASW weights prevents optimization through the weighting rule and improves transfer stability."
    status: not_supported
    priority: high
  - id: H4
    statement: "A late non-saturating PO component preserves USW/ASW early gains after pure preference learning plateaus."
    status: not_needed
    priority: high
  - id: H5
    statement: "Hard-pair mining or removing ASW's absolute-margin factor avoids wasting mass on already-saturated easy pairs."
    status: not_needed
    priority: medium

