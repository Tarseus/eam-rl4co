project:
  title: "Recover remaining USW/ASW significance gaps"
  started: "2026-07-17"
  status: active
  question: "Can validation-selected checkpoints or an unchanged-objective continuation recover FFSP50/JSSP15x15 USW wins and close the CVRP50 ASW-vs-USW gap?"

locked_evaluation:
  primary_test: "two-sided paired Wilcoxon signed-rank"
  correction: "Holm over the unchanged 52-comparison paper family"
  lower_cost_is_better: true
  bootstrap_samples: 20000
  bootstrap_seed: 20260716
  rules:
    - "No checkpoint selection on the paper test instances."
    - "Do not change USW or ASW pair construction or loss definitions and still call the result the original method."
    - "Pairing and candidate pools remain instance-local."
    - "Do not replace the paper registry until a locked candidate passes."

