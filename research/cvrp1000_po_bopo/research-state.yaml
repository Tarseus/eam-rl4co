project:
  title: "CVRP1000 PO and BOPO baselines"
  status: running
  started: "2026-07-15"
  question: "Can capacity50 PO reproduce or beat the AGFN paper's CVRP1000 POMO x8 cost 192.78563, and how does matched-budget BOPO compare?"

problem:
  size: 1000
  coordinate_distribution: "uniform on [0,1]^2"
  demand_distribution: "discrete uniform integers 1..9"
  capacity: 50
  note: "Protocol explicitly follows AGFN ICLR 2025 Table 1."

evaluation:
  paper: "AGFN, ICLR 2025, Table 1"
  paper_pomo_no_augment_cost: 233.093524
  paper_pomo_x8_cost: 192.78563
  official_source: "ZHANG-NI/AGFN data/cvrp/testDataset-1000.pt"
  official_source_sha256: "b8dd0cee789fbda29faf0c68a6de7e351782396a13e2b235c00ca71d6bd9d8ec"
  dataset: "data/vrp/agfn_vrp1000_capacity50_test128.npz"
  dataset_sha256: pending_conversion
  validation_dataset: "data/vrp/agfn_vrp1000_capacity50_val_seed4321.npz"
  validation_sha256: pending_generation
  protocol: "official fixed128, 100 starts, 8 augment, FP32"
  proxy: "fixed32 seed4321, 100 starts, augmentation=1"
  architecture_zero_shot_mean: pending_capacity50
  po_hard_threshold: 192.78563
  po_stretch_threshold_0p5pct: 191.82170185
  po_success: "After at least 1000 continuation steps, PO must reproduce or beat AGFN Table 1 POMO x8 cost 192.78563 on the exact official 128-instance set."
  bopo_reporting: "Evaluate BOPO at the same continuation-step budget and paired official indices 0..127."

training:
  common_initialization: "downloads/cvrp100/po/checkpoint.ckpt"
  first_chunk_steps: 1000
  train_batch_size: 1
  num_starts: 20
  bopo_select_k: 10
  alpha: 0.05
  learning_rate: 1.0e-5
  weight_decay: 1.0e-6
  precision: bf16-mixed
  data_policy: "PO and BOPO use the same deterministic instance indices and action seeds."
  continuation_policy: "If PO misses the target, resume equal-budget PO and BOPO chunks from their best verified checkpoints until PO reaches the locked cost."

experiments:
  capacity150_obsolete:
    status: stopped_by_user_correction
    stopped_steps: {po: 186, bopo: 189}
  zero_shot:
    status: pending_capacity50
  po_1000:
    status: pending_capacity50
  bopo_1000:
    status: pending_capacity50

next:
  - "Download and convert the exact AGFN official CVRP1000 tensor; verify SHA, row order, demands, coordinates, and distances."
  - "Run capacity50 zero-shot calibration and one-step PO/BOPO probes."
  - "Launch matched 1000-step capacity50 PO and BOPO jobs, then evaluate official fixed128."

follow_on:
  ffsp: "After the CVRP1000 PO/BOPO baselines are launched and stable, define a larger-than-FFSP100 matched baseline."
  jssp: "After the CVRP1000 PO/BOPO baselines are launched and stable, use the existing bucketed 10x10/15x15/20x20 pipeline for larger matched baselines."
