model:
  generate_default_data: true
  metrics:
    train:
    - loss
    - reward
    val:
    - reward
    - gap
    - makespan
    test: ${model.metrics.val}
    log_on_step: true
  _target_: rl4co.models.zoo.bopo_fjsp.model.BOPOFJSPModel
  baseline: rollout
  train_data_dir: ${paths.root_dir}/BOPO/FJSP/dataset
  val_data_dir: ${paths.root_dir}/BOPO/FJSP/benchmarks/validation
  test_data_dir: ${paths.root_dir}/BOPO/FJSP/benchmarks/LA-e
  use_cached: true
  batch_size: 1
  val_batch_size: 1
  test_batch_size: 1
  optimizer: Adam
  optimizer_kwargs:
    lr: 2.0e-05
  enc_hidden: 64
  enc_out: 128
  mem_hidden: 64
  mem_out: 128
  clf_hidden: 128
  B: 256
  K: 16
  val_B: 256
  test_B: 32
  greedy: 1
model/params/total: 585408
model/params/trainable: 585408
model/params/non_trainable: 0
trainer:
  _target_: rl4co.utils.trainer.RL4COTrainer
  default_root_dir: ${paths.output_dir}
  gradient_clip_val: null
  accelerator: gpu
  precision: 32-true
  check_val_every_n_epoch: 1
  deterministic: false
  max_epochs: 20
  devices:
  - 0
  enable_progress_bar: false
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: /data1/gushengda/eam-rl4co/logs/train/runs/bopo_fjsp_20260322-132704/checkpoints
    filename: epoch_{epoch:03d}
    monitor: val/reward
    verbose: false
    save_last: true
    save_top_k: -1
    mode: max
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: 1
    save_on_train_epoch_end: null
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 5
  speed_monitor:
    _target_: rl4co.utils.callbacks.speed_monitor.SpeedMonitor
    intra_step_time: true
    inter_step_time: true
    epoch_time: true
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: true
task_name: null
tags:
- dev
ckpt_path: null
seed: 69
