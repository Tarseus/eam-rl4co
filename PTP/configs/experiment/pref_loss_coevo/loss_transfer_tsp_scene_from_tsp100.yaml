preset: simple
search_mode: loss_only
seed: 1234
output_root: runs/pref_loss_tsp_scene_transfer

metric_mode: minimize
improve_eps: 0.0
improve_eps_calibration:
  enabled: false
  N: 8
  sigma_mult: 2.0
  eps_floor: 0.0

loss_transfer_seed:
  enabled: true
  source_run_dir: runs/pref_loss_tsp100_discovery/<run_dir>
  source_pool: elites
  top_k: 8
  max_per_family: 2
  keep_source_fitness: true
  reset_history: false

stage3_multifidelity:
  enabled: true
  rounds:
    - { name: epoch1_inst100000, hf_epochs: 1, hf_instances_per_epoch: 100000, promote_top_frac: 0.5, promote_if_better_than_incumbent: true, promote_only_if_better_than_baseline: true, always_include_incumbent: true }
    - { name: epoch2_inst100000, hf_epochs: 2, hf_instances_per_epoch: 100000 }
stage3_early_prune:
  enabled: true
  scenario_name: tsp50
  max_init_ratio_to_baseline: 2.0
builder_min_coverage: 0.0
seed_with_po4cops_default: false
llm_init_only: false
proxy_joint_swap_check_mode: synthetic
proxy_joint_batch_pass_rate_threshold: 0.9
joint_gate_repair_enabled: true
joint_gate_repair_max_attempts: 8
joint_gate_repair_prompt_path: PTP/prompts/free_loss_forward_error_repair.txt
joint_gate_repair_only_failure_kinds: ["forward_error","backward_error","joint_preference_violation","pref_batch_to_loss_batch_error","loss_not_finite","grad_not_finite","numeric_stress_forward_error","numeric_stress_backward_error","numeric_stress_loss_not_finite","numeric_stress_grad_not_finite","numeric_stress_missing_grads","sandbox_builder_gate_failed","sandbox_runtime_error","sandbox_timeout","sandbox_no_result","sandbox_result_invalid","sandbox_gate_failed"]
joint_numeric_stress_enabled: true
joint_numeric_stress_margin: 120.0
joint_numeric_stress_aux_scale: 32.0
stage0_sandbox_gate_enabled: true
stage0_sandbox_gate_only_when_hf: true
stage0_sandbox_gate_hard_block_hf: true
stage0_sandbox_timeout_s: 25
stage0_sandbox_batch_size: 8
stage0_sandbox_k: 16
stage0_sandbox_rounds: 1
stage0_sandbox_variants: ["visible", "hidden"]
stage0_sandbox_hard_failure_kinds: ["pref_batch_to_loss_batch_error","forward_error","backward_error","loss_not_finite","missing_grads","grad_not_finite","numeric_stress_forward_error","numeric_stress_backward_error","numeric_stress_loss_not_finite","numeric_stress_missing_grads","numeric_stress_grad_not_finite"]

devices: ["cuda:0", "cuda:1", "cuda:2", "cuda:3"]
mp:
  enabled: true
  processes: 4
  start_method: spawn

eval_stages:
  stage0_gate: true
  stage1_proxy: false
  stage2_micro_unroll: false
  stage3_high_fidelity: true

proxy_gate_repair:
  enabled: true
  max_repairs_per_gen: 32
  max_attempts_per_pair: 4
  repair_builder_on_builder_gate_fail: true
  repair_loss_on_joint_gate_fail: true

drop_pref_cache_before_micro_unroll: true

budgets:
  generations: 4
  pairing_budget_per_gen: 64
  high_fidelity_top_m: 999999
  hf_epochs: 1

f1_steps: 200
hf_epochs: 1
hf_instances_per_epoch: 100000
train_problem_size: 50
valid_problem_sizes: [50]
train_batch_size: 64
num_validation_episodes: 10000
validation_batch_size: 64
pomo_size: null
loss_observables: [seq_len, log_prob_mean, advantage, entropy, log_prob_step]
ref_policy_source: none
scratch_init_seed: 1234
backend: rl4co
env_name: tsp
generator_params:
  num_loc: 50
policy_name: pomo
policy_kwargs:
  po4cops_compat: true
  embed_dim: 128
  num_encoder_layers: 6
  decoder_layer_num: 1
  qkv_dim: 16
  num_heads: 8
  feedforward_hidden: 512
  tanh_clipping: 50
  eval_type: argmax
  val_decode_type: greedy
  test_decode_type: greedy
rollout_strategy: auto
objective_sign: neg_reward
learning_rate: 0.0003
weight_decay: 0.000001

baseline:
  mini_eval_paths:
    epoch1_inst100000: baseline/mini_eval/baseline_minitrain_tsp50_epoch1_inst100000.json
    epoch2_inst100000: baseline/mini_eval/baseline_minitrain_tsp50_epoch2_inst100000.json
  checkpoints:
    - baseline/tsp50_epoch_50.ckpt
  include_scratch: true
  multiseed_compare_enabled: false
  scenarios:
    - name: tsp50
      problem: tsp
      env_name: tsp
      train_problem_size: 50
      valid_problem_sizes: [50]
      generator_params:
        num_loc: 50
      baseline:
        mini_eval_paths:
          epoch1_inst100000: baseline/mini_eval/baseline_minitrain_tsp50_epoch1_inst100000.json
          epoch2_inst100000: baseline/mini_eval/baseline_minitrain_tsp50_epoch2_inst100000.json
        checkpoints:
          - baseline/tsp50_epoch_50.ckpt
    - name: tsp100
      problem: tsp
      env_name: tsp
      train_problem_size: 100
      valid_problem_sizes: [100]
      generator_params:
        num_loc: 100
      baseline:
        mini_eval_paths:
          epoch1_inst100000: baseline/mini_eval/baseline_minitrain_tsp100_epoch1_inst100000.json
          epoch2_inst100000: baseline/mini_eval/baseline_minitrain_tsp100_epoch2_inst100000.json
        checkpoints:
          - baseline/tsp100_epoch_135.ckpt

builder_pair_budget:
  per_instance: 8192
  total: 8192

population:
  n_candidates_loss: 12
  n_candidates_builder: 16
  keep_top_k: 8

builder_llm:
  enabled: false
  offline_mode: false
  parent_p: 5
  seed_reserve: 0
  family_diversity:
    enabled: true
    min_per_family: 1
    elite_max_per_family: 2
    parent_max_per_family: 1
    include_unknown: false
  operator_bank:
    init:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
    per_gen:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 8
    simplify_first: true

loss_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 0
  exploration:
    enabled: false
  family_diversity:
    enabled: true
    min_per_family: 1
    elite_max_per_family: 2
    parent_max_per_family: 1
    include_unknown: false
  operator_bank:
    init:
      - { name: TUNE, count: 8 }
      - { name: XOVER, count: 2 }
      - { name: STRUCTURE_SHIFT, count: 2 }
    per_gen:
      - { name: TUNE, count: 8 }
      - { name: XOVER, count: 2 }
      - { name: STRUCTURE_SHIFT, count: 2 }
      - { name: CONSTRAINT_INJECT, count: 2 }
  novelty:
    enabled: true
    max_similarity: 1.0
    neighbors: 3
    apply_to_elites: false
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 8
    simplify_first: true

llm_prompts:
  builder_paradigm_shift: PTP/prompts/pref_builder_paradigm_shift.txt
  builder_structure_shift: PTP/prompts/pref_builder_structure_shift.txt
  builder_constraint_inject: PTP/prompts/pref_builder_constraint_inject.txt
  loss_paradigm_shift: PTP/prompts/free_loss_paradigm_shift.txt
  loss_structure_shift: PTP/prompts/free_loss_structure_shift.txt
  loss_constraint_inject: PTP/prompts/free_loss_constraint_inject.txt
