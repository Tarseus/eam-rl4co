preset: simple
search_mode: alternating
seed: 1234
output_root: runs/pref_loss_alternating_simple

metric_mode: minimize
improve_eps: 0.0
builder_min_coverage: 0.0
seed_with_po4cops_default: false
llm_init_only: true
proxy_joint_swap_check_mode: synthetic
proxy_joint_batch_pass_rate_threshold: 0.9

devices: ["cuda:0", "cuda:1", "cuda:2", "cuda:3"]
mp:
  enabled: true
  processes: 4
  start_method: spawn

eval_stages:
  stage0_gate: true
  stage1_proxy: false
  stage2_micro_unroll: false
  stage3_high_fidelity: true

proxy_gate_repair:
  enabled: true
  max_repairs_per_gen: 32
  max_attempts_per_pair: 4
  repair_builder_on_builder_gate_fail: true
  repair_loss_on_joint_gate_fail: true

drop_pref_cache_before_micro_unroll: true

budgets:
  generations: 20
  pairing_budget_per_gen: 128
  high_fidelity_top_m: 999999
  hf_epochs: 0

alternating_schedule:
  loss_generations: 10
  pair_generations: 10
  rounds: 1

# Stage3 offline mini-train protocol (explicit, used by eval_signature).
f1_steps: 200
hf_epochs: 0
hf_instances_per_epoch: 0
train_problem_size: 100
valid_problem_sizes: [20, 100]
train_batch_size: 64
num_validation_episodes: 512
validation_batch_size: 64
pomo_size: 20
scratch_init_seed: 12345
policy_name: pomo
policy_kwargs:
  po4cops_compat: true

baseline:
  mini_eval_path: baseline/mini_eval/baseline_minitrain_tsp100_K200.json
  checkpoints:
    - baseline/epoch_135.ckpt
    - baseline/epoch_409.ckpt
  include_scratch: true

generator_params:
  offline_train_path: offline_data/tsp100_train.pt
  offline_val_paths:
    "20": offline_data/tsp20_val.pt
    "100": offline_data/tsp100_val.pt

builder_pair_budget:
  per_instance: 8192
  total: 8192

population:
  n_candidates_loss: 12
  n_candidates_builder: 12
  keep_top_k: 8

# Keep alternating search but still use Double-EoH operators on both sides.
builder_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 0
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 4
    simplify_first: true

loss_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 0
  novelty:
    enabled: true
    max_similarity: 0.92
    neighbors: 3
    apply_to_elites: false
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 4
    simplify_first: true
