preset: simple
search_mode: alternating
seed: 1234
output_root: runs/pref_loss_alternating_simple

metric_mode: minimize
improve_eps: 0.0
improve_eps_calibration:
  enabled: true
  N: 8
  sigma_mult: 2.0
  eps_floor: 0.0

stage3_multifidelity:
  enabled: true
  rounds:
    # Round-0: quick filter (淘汰明显差的)
    - { name: K200, f1_steps: 200, promote_top_m: 32, promote_if_better_than_incumbent: true, always_include_incumbent: true }
    # Round-1: confirmation (选真正的胜者)
    - { name: K1000, f1_steps: 1000 }
builder_min_coverage: 0.0
seed_with_po4cops_default: false
llm_init_only: true
proxy_joint_swap_check_mode: synthetic
proxy_joint_batch_pass_rate_threshold: 0.9
joint_gate_repair_enabled: true
joint_gate_repair_max_attempts: 2
joint_gate_repair_prompt_path: PTP/prompts/free_loss_forward_error_repair.txt
joint_gate_repair_only_failure_kinds: ["forward_error","backward_error","pref_batch_to_loss_batch_error","loss_not_finite","grad_not_finite","numeric_stress_forward_error","numeric_stress_backward_error","numeric_stress_loss_not_finite","numeric_stress_grad_not_finite","numeric_stress_missing_grads","sandbox_builder_gate_failed","sandbox_runtime_error","sandbox_timeout","sandbox_no_result","sandbox_result_invalid","sandbox_gate_failed"]
joint_numeric_stress_enabled: true
joint_numeric_stress_margin: 120.0
joint_numeric_stress_aux_scale: 32.0
stage0_sandbox_gate_enabled: true
stage0_sandbox_gate_only_when_hf: true
stage0_sandbox_gate_hard_block_hf: true
stage0_sandbox_timeout_s: 25
stage0_sandbox_batch_size: 8
stage0_sandbox_k: 16
stage0_sandbox_rounds: 1
stage0_sandbox_variants: ["visible", "hidden"]
stage0_sandbox_hard_failure_kinds: ["pref_batch_to_loss_batch_error","forward_error","backward_error","loss_not_finite","missing_grads","grad_not_finite","numeric_stress_forward_error","numeric_stress_backward_error","numeric_stress_loss_not_finite","numeric_stress_missing_grads","numeric_stress_grad_not_finite"]

devices: ["cuda:0", "cuda:1", "cuda:2", "cuda:3"]
mp:
  enabled: true
  processes: 4
  start_method: spawn

eval_stages:
  stage0_gate: true
  stage1_proxy: false
  stage2_micro_unroll: false
  stage3_high_fidelity: true

proxy_gate_repair:
  enabled: true
  max_repairs_per_gen: 32
  max_attempts_per_pair: 4
  repair_builder_on_builder_gate_fail: true
  repair_loss_on_joint_gate_fail: true

drop_pref_cache_before_micro_unroll: true

budgets:
  generations: 30
  pairing_budget_per_gen: 128
  high_fidelity_top_m: 999999
  hf_epochs: 0

alternating_schedule:
  loss_generations: 10
  pair_generations: 10
  final_loss_generations: 10
  rounds: 1

# Stage3 offline mini-train protocol (explicit, used by eval_signature).
f1_steps: 200
hf_epochs: 0
hf_instances_per_epoch: 0
train_problem_size: 100
valid_problem_sizes: [100]
train_batch_size: 64
num_validation_episodes: 512
validation_batch_size: 64
pomo_size: null
loss_observables: [seq_len, log_prob_mean, advantage, entropy, log_prob_step]
ref_policy_source: none
scratch_init_seed: 12345
policy_name: pomo
policy_kwargs:
  po4cops_compat: true

baseline:
  mini_eval_paths:
    200: baseline/mini_eval/baseline_minitrain_tsp100_K200.json
    1000: baseline/mini_eval/baseline_minitrain_tsp100_K1000.json
  checkpoints:
    - baseline/epoch_135.ckpt
    - baseline/epoch_409.ckpt
  include_scratch: true
  multiseed_compare_enabled: true

generator_params:
  offline_train_path: offline_data/tsp100_train.pt
  offline_val_paths:
    "100": offline_data/tsp100_val.pt

# "20": offline_data/tsp20_val.pt

builder_pair_budget:
  per_instance: 8192
  total: 8192

population:
  n_candidates_loss: 12
  n_candidates_builder: 12
  keep_top_k: 8

# Keep alternating search but still use Double-EoH operators on both sides.
builder_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 0
  family_diversity:
    enabled: true
    min_per_family: 1
    elite_max_per_family: 2
    parent_max_per_family: 1
    include_unknown: false
  operator_bank:
    init:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
    per_gen:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 4
    simplify_first: true

loss_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 0
  exploration:
    enabled: true
    stagnation_generations: 3
    replace_p: 0.7
  family_diversity:
    enabled: true
    min_per_family: 1
    elite_max_per_family: 2
    parent_max_per_family: 1
    include_unknown: false
  operator_bank:
    init:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
    per_gen:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
  novelty:
    enabled: true
    max_similarity: 0.92
    neighbors: 3
    apply_to_elites: false
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 4
    simplify_first: true

llm_prompts:
  builder_paradigm_shift: PTP/prompts/pref_builder_paradigm_shift.txt
  builder_structure_shift: PTP/prompts/pref_builder_structure_shift.txt
  builder_constraint_inject: PTP/prompts/pref_builder_constraint_inject.txt
  loss_paradigm_shift: PTP/prompts/free_loss_paradigm_shift.txt
  loss_structure_shift: PTP/prompts/free_loss_structure_shift.txt
  loss_constraint_inject: PTP/prompts/free_loss_constraint_inject.txt
