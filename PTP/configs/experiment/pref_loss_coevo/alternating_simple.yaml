preset: simple
search_mode: alternating
seed: 0
output_root: runs/pref_loss_alternating_simple

metric_mode: minimize
improve_eps: 0.0
builder_min_coverage: 0.0
seed_with_po4cops_default: true

devices: ["cuda:0", "cuda:1", "cuda:2", "cuda:3"]
mp:
  enabled: true
  processes: 4
  start_method: spawn

eval_stages:
  stage0_gate: true
  stage1_proxy: true
  stage2_micro_unroll: false
  stage3_high_fidelity: true

proxy_gate_repair:
  enabled: true
  max_repairs_per_gen: 32
  max_attempts_per_pair: 4
  repair_builder_on_builder_gate_fail: true
  repair_loss_on_joint_gate_fail: true

budgets:
  generations: 20
  pairing_budget_per_gen: 128
  proxy_batches: 10
  proxy_batch_size: 64
  micro_unroll_steps: 8
  micro_unroll_max_pairs: 8192
  high_fidelity_top_m: 8
  hf_epochs: 10

alternating_schedule:
  loss_generations: 10
  pair_generations: 10
  rounds: 1

# Keep HF split evaluation enabled by default (scratch + warmstart).
scratch_hf_epochs: 5
warmstart_hf_epochs: 5
baseline:
  metrics_csv: baseline/metrics.csv
  checkpoint: baseline/epoch_409.ckpt
  checkpoint_epoch: 409
  val_column: val/max_reward

builder_pair_budget:
  per_instance: 8192
  total: 8192

population:
  n_candidates_loss: 12
  n_candidates_builder: 12
  keep_top_k: 8

# Keep alternating search but still use Double-EoH operators on both sides.
builder_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 2
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 1
    simplify_first: true

loss_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 2
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 1
    simplify_first: true
