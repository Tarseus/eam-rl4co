preset: simple
search_mode: alternating
seed: 0
output_root: runs/pref_loss_alternating_simple

metric_mode: minimize
improve_eps: 0.0

eval_stages:
  stage0_gate: true
  stage1_proxy: true
  stage2_micro_unroll: false
  stage3_high_fidelity: true

budgets:
  generations: 50
  pairing_budget_per_gen: 128
  proxy_batches: 10
  proxy_batch_size: 64
  micro_unroll_steps: 8
  micro_unroll_max_pairs: 8192
  high_fidelity_top_m: 8
  hf_epochs: 1

builder_pair_budget:
  per_instance: 64
  total: 8192

population:
  n_candidates_loss: 64
  n_candidates_builder: 64
  keep_top_k: 8

# Keep alternating search but still use Double-EoH operators on both sides.
builder_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 2
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 1
    simplify_first: true

loss_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 2
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 1
    simplify_first: true
