preset: simple
search_mode: builder_only
seed: 1234
output_root: runs/pref_builder_weight_search_cvrp100

metric_mode: minimize
improve_eps: 0.0
improve_eps_calibration:
  enabled: false
  N: 8
  sigma_mult: 2.0
  eps_floor: 0.0

stage3_multifidelity:
  enabled: false
  rounds: []
stage3_early_prune:
  enabled: true
  scenario_name: cvrp100
  max_init_ratio_to_baseline: 2.0
cheap_gate_on: true
high_fidelity_on: true
seed_with_po4cops_default: false
llm_init_only: true
builder_min_coverage: 0.0
builder_max_pairs_per_instance: 8192
builder_min_instance_weight_cv: 0.10
builder_min_instance_weight_cv_pass_rate: 0.75
proxy_joint_swap_check_mode: synthetic
proxy_joint_batch_pass_rate_threshold: 0.9
joint_gate_repair_enabled: true
joint_gate_repair_max_attempts: 8
joint_gate_repair_prompt_path: PTP/prompts/free_loss_forward_error_repair.txt
joint_gate_repair_only_failure_kinds: ["forward_error","backward_error","joint_preference_violation","pref_batch_to_loss_batch_error","loss_not_finite","grad_not_finite","numeric_stress_forward_error","numeric_stress_backward_error","numeric_stress_loss_not_finite","numeric_stress_grad_not_finite","numeric_stress_missing_grads","sandbox_builder_gate_failed","sandbox_runtime_error","sandbox_timeout","sandbox_no_result","sandbox_result_invalid","sandbox_gate_failed"]
joint_numeric_stress_enabled: true
joint_numeric_stress_margin: 120.0
joint_numeric_stress_aux_scale: 32.0
stage0_sandbox_gate_enabled: true
stage0_sandbox_gate_only_when_hf: true
stage0_sandbox_gate_hard_block_hf: true
stage0_sandbox_timeout_s: 25
stage0_sandbox_batch_size: 8
stage0_sandbox_k: 16
stage0_sandbox_rounds: 1
stage0_sandbox_variants: ["visible", "hidden"]
stage0_sandbox_hard_failure_kinds: ["pref_batch_to_loss_batch_error","forward_error","backward_error","loss_not_finite","missing_grads","grad_not_finite","numeric_stress_forward_error","numeric_stress_backward_error","numeric_stress_loss_not_finite","numeric_stress_missing_grads","numeric_stress_grad_not_finite"]

loss_transfer_seed:
  enabled: true
  source_loss_path: runs/pref_loss_cvrp100_from_tsp100_elite/20260320-224008/best_loss.json
  keep_source_fitness: true
  reset_history: false
  re_eval_current_protocol: true

builder_search_space:
  enabled: true
  mode: reweight_only
  fixed_pair_builder: all_pairs
  pair_weight_normalization: none
  seed_weight_families: [gap_linear, gap_softmax, gap_sigmoid, gap_square]
  allow_freeform_weight_family: true
  allow_uniform_none: false

budgets:
  generations: 10
  pairing_budget_per_gen: 16
  high_fidelity_top_m: 32
  hf_epochs: 10
  scratch_hf_epochs: 5
  warmstart_hf_epochs: 5

population:
  n_candidates_builder: 16
  n_candidates_loss: 1
  keep_top_k: 8

backend: rl4co
env_name: cvrp
policy_name: pomo
devices: ["cuda:0", "cuda:1", "cuda:2", "cuda:3"]
mp:
  enabled: true
  processes: 4
  start_method: spawn
eval_stages:
  stage0_gate: true
  stage1_proxy: false
  stage2_micro_unroll: false
  stage3_high_fidelity: true
train_problem_size: 100
valid_problem_sizes: [100]
train_batch_size: 64
validation_batch_size: 64
num_validation_episodes: 512
proxy_problem_size: 100
proxy_batch_size: 64
proxy_batches: 2
pomo_size: null
generator_params:
  num_loc: 100

baseline:
  mini_eval_paths:
    epoch10_inst100000: baseline/mini_eval/baseline_minitrain_cvrp100_epoch10_inst100000.json
  checkpoints:
    - baseline/cvrp100_epoch_100.ckpt
  include_scratch: true
  multiseed_compare_enabled: false
  scenarios:
    - name: cvrp100
      problem: cvrp
      env_name: cvrp
      train_problem_size: 100
      valid_problem_sizes: [100]
      policy_kwargs:
        po4cops_compat: true
      generator_params:
        num_loc: 100
      baseline:
        mini_eval_paths:
          epoch10_inst100000: baseline/mini_eval/baseline_minitrain_cvrp100_epoch10_inst100000.json
        checkpoints:
          - baseline/cvrp100_epoch_100.ckpt

builder_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 0
  proposal_family_quota:
    enabled: true
    min_per_weight_family: 1
    max_per_weight_family: 0
    target_weight_families: [gap_linear, gap_softmax, gap_sigmoid, gap_square]
    seed_missing_families: true
  search_space:
    enabled: true
    mode: reweight_only
    fixed_pair_builder: all_pairs
    pair_weight_normalization: none
    seed_weight_families: [gap_linear, gap_softmax, gap_sigmoid, gap_square]
    allow_freeform_weight_family: true
    allow_uniform_none: false
  operator_bank:
    init:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 2 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
    per_gen:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 2 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }

loss_llm:
  enabled: false
