preset: simple
search_mode: loss_only
seed: 69
output_root: runs/pref_loss_fjsp10j5m_discovery

metric_mode: minimize
improve_eps: 0.0
improve_eps_calibration:
  enabled: false
  N: 8
  sigma_mult: 2.0
  eps_floor: 0.0

stage3_multifidelity:
  enabled: false
  rounds: []
stage3_early_prune:
  enabled: true
  scenario_name: fjsp10j5m
  max_init_ratio_to_baseline: 2.0
builder_min_coverage: 0.0
seed_with_po4cops_default: false
llm_init_only: true
proxy_joint_swap_check_mode: synthetic
proxy_joint_batch_pass_rate_threshold: 0.9
joint_gate_repair_enabled: true
joint_gate_repair_max_attempts: 8
joint_gate_repair_prompt_path: PTP/prompts/free_loss_forward_error_repair.txt
joint_gate_repair_only_failure_kinds: ["forward_error","backward_error","joint_preference_violation","pref_batch_to_loss_batch_error","loss_not_finite","grad_not_finite","numeric_stress_forward_error","numeric_stress_backward_error","numeric_stress_loss_not_finite","numeric_stress_missing_grads","numeric_stress_grad_not_finite","sandbox_builder_gate_failed","sandbox_runtime_error","sandbox_timeout","sandbox_no_result","sandbox_result_invalid","sandbox_gate_failed"]
joint_numeric_stress_enabled: true
joint_numeric_stress_margin: 120.0
joint_numeric_stress_aux_scale: 32.0
stage0_sandbox_gate_enabled: true
stage0_sandbox_gate_only_when_hf: true
stage0_sandbox_gate_hard_block_hf: true
stage0_sandbox_timeout_s: 25
stage0_sandbox_batch_size: 8
stage0_sandbox_k: 16
stage0_sandbox_rounds: 1
stage0_sandbox_variants: ["visible", "hidden"]
stage0_sandbox_hard_failure_kinds: ["pref_batch_to_loss_batch_error","forward_error","backward_error","loss_not_finite","missing_grads","grad_not_finite","numeric_stress_forward_error","numeric_stress_backward_error","numeric_stress_loss_not_finite","numeric_stress_missing_grads","numeric_stress_grad_not_finite"]

devices: ["cuda:0"]
mp:
  enabled: false
  processes: 1
  start_method: spawn

eval_stages:
  stage0_gate: true
  stage1_proxy: false
  stage2_micro_unroll: false
  stage3_high_fidelity: true

proxy_gate_repair:
  enabled: true
  max_repairs_per_gen: 32
  max_attempts_per_pair: 4
  repair_builder_on_builder_gate_fail: true
  repair_loss_on_joint_gate_fail: true

drop_pref_cache_before_micro_unroll: true

budgets:
  generations: 10
  pairing_budget_per_gen: 128
  high_fidelity_top_m: 999999
  hf_epochs: 10

f1_steps: 200
hf_epochs: 10
hf_instances_per_epoch: 1000
scratch_hf_epochs: 5
warmstart_hf_epochs: 5
baseline_epoch_compare_offset: 0
baseline_epoch_violation_weight: 1.0
baseline_epoch_tail_frac: 1.0
baseline_epoch_window_k: 10
baseline_epoch_window_violation_weight: 0.0
early_eval_steps: 0
train_problem_size: 10
valid_problem_sizes: [10]
train_batch_size: 1
num_validation_episodes: 100
validation_batch_size: 1
pomo_size: 16
loss_observables: [seq_len, log_prob_mean, advantage, entropy, log_prob_step]
ref_policy_source: none
scratch_init_seed: 69
backend: rl4co
env_name: fjsp
generator_params:
  num_jobs: 10
  num_machines: 5
  min_ops_per_job: 4
  max_ops_per_job: 6
  min_processing_time: 1
  max_processing_time: 20
  min_eligible_ma_per_op: 1
policy_name: l2d
policy_kwargs:
  test_decode_type: greedy
rollout_strategy: auto
objective_sign: neg_reward
learning_rate: 0.00002
weight_decay: 0.0

baseline:
  # 需要先训练baseline
  # metrics_csv: baseline/fjsp10j5m_metrics.csv
  # checkpoint: baseline/fjsp10j5m_epoch_20.ckpt
  # checkpoint_epoch: 20
  include_scratch: true
  multiseed_compare_enabled: false
  scenarios:
    - name: fjsp10j5m
      problem: fjsp
      env_name: fjsp
      train_problem_size: 10
      valid_problem_sizes: [10]
      generator_params:
        num_jobs: 10
        num_machines: 5

builder_pair_budget:
  per_instance: 8192
  total: 8192

population:
  n_candidates_loss: 16
  n_candidates_builder: 16
  keep_top_k: 8

builder_llm:
  enabled: false
  offline_mode: false
  parent_p: 5
  seed_reserve: 0
  family_diversity:
    enabled: true
    min_per_family: 1
    elite_max_per_family: 2
    parent_max_per_family: 1
    include_unknown: false
  operator_bank:
    init:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
    per_gen:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 8
    simplify_first: true

loss_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 0
  exploration:
    enabled: true
    stagnation_generations: 3
    replace_p: 0.7
  family_diversity:
    enabled: true
    min_per_family: 1
    elite_max_per_family: 2
    parent_max_per_family: 1
    include_unknown: false
  operator_bank:
    init:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
    per_gen:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
  novelty:
    enabled: true
    max_similarity: 1.0
    neighbors: 3
    apply_to_elites: false
  init_num_E1: 6
  init_num_E2: 4
  init_num_M1: 4
  init_num_M2: 4
  num_E1: 8
  num_E2: 8
  num_M1: 8
  num_M2: 8
  repair:
    enabled: true
    max_attempts: 8
    simplify_first: true

llm_prompts:
  builder_paradigm_shift: PTP/prompts/pref_builder_paradigm_shift.txt
  builder_structure_shift: PTP/prompts/pref_builder_structure_shift.txt
  builder_constraint_inject: PTP/prompts/pref_builder_constraint_inject.txt
  loss_paradigm_shift: PTP/prompts/free_loss_paradigm_shift.txt
  loss_structure_shift: PTP/prompts/free_loss_structure_shift.txt
  loss_constraint_inject: PTP/prompts/free_loss_constraint_inject.txt
