preset: simple
search_mode: builder_only
seed: 1234
output_root: runs/pref_builder_weight_target_ffsp50_from_ffsp100_best_weighting
resume:
  enabled: true
  mode: latest_incomplete

metric_mode: minimize
improve_eps: 0.0
stage3_multifidelity:
  enabled: false
  rounds: []
stage3_early_prune:
  enabled: true
  scenario_name: ffsp50
  max_init_ratio_to_baseline: 2.0
seed_with_po4cops_default: false
llm_init_only: true
builder_min_coverage: 0.0
builder_max_pairs_per_instance: 8192
builder_min_instance_weight_cv: 0.10
builder_min_instance_weight_cv_pass_rate: 0.75
proxy_joint_swap_check_mode: synthetic
proxy_joint_batch_pass_rate_threshold: 0.9
joint_gate_repair_enabled: true
joint_gate_repair_max_attempts: 8
joint_gate_repair_prompt_path: PTP/prompts/free_loss_forward_error_repair.txt
joint_gate_repair_only_failure_kinds: ["forward_error","backward_error","joint_preference_violation","pref_batch_to_loss_batch_error","loss_not_finite","grad_not_finite","numeric_stress_forward_error","numeric_stress_backward_error","numeric_stress_loss_not_finite","numeric_stress_grad_not_finite","numeric_stress_missing_grads","sandbox_builder_gate_failed","sandbox_runtime_error","sandbox_timeout","sandbox_no_result","sandbox_result_invalid","sandbox_gate_failed"]
joint_numeric_stress_enabled: true
joint_numeric_stress_margin: 120.0
joint_numeric_stress_aux_scale: 32.0
stage0_sandbox_gate_enabled: true
stage0_sandbox_gate_only_when_hf: true
stage0_sandbox_gate_hard_block_hf: true
stage0_sandbox_timeout_s: 25
stage0_sandbox_batch_size: 8
stage0_sandbox_k: 16
stage0_sandbox_rounds: 1
stage0_sandbox_variants: ["visible", "hidden"]
stage0_sandbox_hard_failure_kinds: ["pref_batch_to_loss_batch_error","forward_error","backward_error","loss_not_finite","missing_grads","grad_not_finite","numeric_stress_forward_error","numeric_stress_backward_error","numeric_stress_loss_not_finite","numeric_stress_missing_grads","numeric_stress_grad_not_finite"]

loss_transfer_seed:
  enabled: true
  source_loss_path: runs/pref_loss_ffsp100_discovery/20260403-142801/best_loss.json
  keep_source_fitness: true
  reset_history: false
  re_eval_current_protocol: true
builder_transfer_seed:
  enabled: true
  source_builder_path: runs/pref_builder_weight_search_ffsp100/20260416-111514/best_builder.json
  keep_source_fitness: true
  reset_history: false

builder_search_space:
  enabled: true
  mode: reweight_only
  fixed_pair_builder: all_pairs
  pair_weight_normalization: none
  require_instance_stats: true
  require_instance_conditioning: true
  instance_stat_keys: &ffsp_instance_stats
    - instance_obj_mean
    - instance_obj_std
    - instance_obj_median
    - instance_obj_mad
    - instance_obj_min
    - instance_obj_max
    - instance_obj_range
    - instance_log_prob_mean
    - instance_log_prob_std
    - instance_log_prob_range
    - instance_regret_mean
    - instance_regret_std
    - instance_regret_max
  seed_weight_families: &ffsp_weight_families [gap_linear, gap_rank_blend, gap_regret_blend, margin_rank_blend, margin_regret_blend, gap_bandpass]
  allow_freeform_weight_family: false
  allow_uniform_none: false

devices: ["cuda:0", "cuda:1"]
aggressive_cuda_cleanup: true
aggressive_cuda_cleanup_mode: epoch
hf_subprocess_cuda_launch_blocking: true
cuda_diagnostics_enabled: true
cuda_diagnostics_include_nvidia_smi: true
mp:
  enabled: true
  processes: 2
  start_method: spawn
eval_stages:
  stage0_gate: true
  stage1_proxy: false
  stage2_micro_unroll: false
  stage3_high_fidelity: true
budgets:
  generations: 30
  pairing_budget_per_gen: 32
  high_fidelity_top_m: 32
  hf_epochs: 20
  scratch_hf_epochs: 10
  warmstart_hf_epochs: 10

f1_steps: 200
hf_epochs: 20
hf_instances_per_epoch: 1000
scratch_hf_epochs: 10
warmstart_hf_epochs: 10
train_problem_size: 50
valid_problem_sizes: [50]
train_batch_size: 32
num_validation_episodes: 1000
validation_batch_size: 50
pomo_size: 24
loss_observables: [advantage]
scratch_init_seed: 1234
backend: rl4co
problem: ffsp
env_name: ffsp
generator_params:
  num_stage: 3
  num_machine: 4
  num_job: 50
  flatten_stages: false
policy_name: matnet
policy_kwargs:
  embed_dim: 256
  num_encoder_layers: 3
  num_heads: 16
  normalization: instance
  use_graph_context: false
  feedforward_hidden: 512
  train_decode_type: sampling
  val_decode_type: greedy
  test_decode_type: greedy
rollout_strategy: auto
objective_sign: neg_reward
learning_rate: 0.0001
weight_decay: 0.000001
alpha: 1.0
po_impl: exponential
precision: 32-true

baseline:
  mini_eval_paths:
    epoch20_inst1000: baseline/mini_eval/baseline_minitrain_ffsp50_epoch20_inst1000.json
  checkpoints:
    - baseline/ffsp_matnet_po_paper100_epoch_100.ckpt
  include_scratch: true
  multiseed_compare_enabled: false
  scenarios:
    - name: ffsp50
      problem: ffsp
      env_name: ffsp
      train_problem_size: 50
      valid_problem_sizes: [50]
      generator_params:
        num_stage: 3
        num_machine: 4
        num_job: 50
        flatten_stages: false
      baseline:
        mini_eval_paths:
          epoch20_inst1000: baseline/mini_eval/baseline_minitrain_ffsp50_epoch20_inst1000.json
        checkpoints:
          - baseline/ffsp_matnet_po_paper100_epoch_100.ckpt

builder_pair_budget:
  per_instance: 8192
  total: 8192
population:
  n_candidates_builder: 16
  n_candidates_loss: 1
  keep_top_k: 8

builder_llm:
  enabled: true
  offline_mode: false
  parent_p: 5
  seed_reserve: 0
  proposal_family_quota:
    enabled: true
    min_per_weight_family: 1
    max_per_weight_family: 0
    target_weight_families: *ffsp_weight_families
    seed_missing_families: true
  search_space:
    enabled: true
    mode: reweight_only
    fixed_pair_builder: all_pairs
    pair_weight_normalization: none
    require_instance_stats: true
    require_instance_conditioning: true
    instance_stat_keys: *ffsp_instance_stats
    seed_weight_families: *ffsp_weight_families
    allow_freeform_weight_family: false
    allow_uniform_none: false
  operator_bank:
    init:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
    per_gen:
      - { name: GEN, count: 4 }
      - { name: PARADIGM_SHIFT, count: 6 }
      - { name: STRUCTURE_SHIFT, count: 4 }
      - { name: CONSTRAINT_INJECT, count: 4 }
      - { name: XOVER, count: 2 }
      - { name: TUNE, count: 2 }
  repair:
    enabled: true
    max_attempts: 8
    simplify_first: true
loss_llm:
  enabled: false

